# yaml-language-server: $schema=../../schema/devices.schema.json
- id: plc
  kind: plc
  model: WAGO 750-881
  location: plc-cabinet
  hostname: plc.lan
  notes: Low-level logic for switches and blinds.

- id: plc-di01
  kind: io-module
  model: WAGO 750-403 (4 DI 24V)
  label: DI 01
  location: plc
  ports:
    - { name: "DI 01.1", signal: DI 24V }
    - { name: "DI 01.2", signal: DI 24V }
    - { name: "DI 01.3", signal: DI 24V }
    - { name: "DI 01.4", signal: DI 24V }

- id: plc-do01
  kind: io-module
  model: WAGO 750-504 (4 DO 24V)
  label: DO 01
  location: plc
  ports:
    - { name: "DO 01.1", signal: DO 24V }
    - { name: "DO 01.2", signal: DO 24V }

- id: esp-dressing
  kind: esp
  model: NodeMCU v3
  location: 1-DRS-ESP-01
  firmware: ESPHome
  hostname: esp-dressing
  mac: null
  powered_by: sonoff-mirror
  ports:
    - { name: GPIO14, signal: GPIO }

- id: sonoff-mirror
  kind: relay
  model: Sonoff Mini
  location: 1-DRS-LGT-01
  firmware: Tasmota
  hostname: sonoff-mirror

- id: F3
  kind: breaker
  model: C16
  location: board-main

- id: RCD1
  kind: rcd
  model: 30 mA type A
  location: board-main
