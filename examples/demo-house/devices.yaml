# yaml-language-server: $schema=../../schema/devices.schema.json
- id: plc
  kind: plc
  model: WAGO 750-881
  location: plc-cabinet
  hostname: plc.lan
  notes: Low-level logic for switches and blinds. Its I/O modules come from imports/plc-configuration.exp.

- id: esp-dressing
  kind: esp
  model: NodeMCU v3
  location: 1-DRS-ESP-01
  firmware: ESPHome
  hostname: esp-dressing
  mac: null
  powered_by: sonoff-mirror
  ports:
    - { name: GPIO14, signal: GPIO }

- id: sonoff-mirror
  kind: relay
  model: Sonoff Mini
  location: 1-DRS-LGT-01
  firmware: Tasmota
  hostname: sonoff-mirror

- id: F3
  kind: breaker
  model: C16
  location: board-main

- id: RCD1
  kind: rcd
  model: 30 mA type A
  location: board-main
