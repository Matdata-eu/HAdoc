# Example: run HAdoc next to openHAB. Point the volume at a git checkout of your house data.
services:
  hadoc:
    image: ghcr.io/matdata-eu/hadoc:latest
    build: .
    container_name: hadoc
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./house:/data
    environment:
      # Commit every edit made in the app to the git repository in ./house.
      HADOC_GIT_COMMIT: "1"
      # Set to "1" to turn editing off.
      HADOC_READONLY: "0"
      # Secrets for the live connections in settings.yaml (integrations).
      HADOC_OPENHAB_TOKEN: ${HADOC_OPENHAB_TOKEN:-}
      HADOC_UNIFI_KEY: ${HADOC_UNIFI_KEY:-}
    # The app writes edits as the "node" user (uid 1000); ./house must be writable for it.
    user: "1000:1000"
